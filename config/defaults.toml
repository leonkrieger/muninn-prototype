[suit]
suitID = "delta-01"

[egress]
pub_backend = "zeromq"
endpoint = "tcp://172.16.254.110:5555"

[ingress]
enabled = false
transport = "zeromq"
endpoint = "tcp://172.16.254.109:5556"
topic = ""

[logging]
level = "DEBUG"

[heartbeat]
hb_freq_s = 10

[monitoring]
allowed_missed_heartbeats = 1

[communications]
enabled = true
executable = "/opt/talkkonnect/dist/talkkonnect"
config_path = "/home/admin/.config/talkkonnect-delta.xml"
restart_delay_s = 10
startup_grace_s = 2

[optics]
enabled = true
feed_fps = 0.2
width = 640
height = 480
jpeg_quality = 70
save_feed_images = false

[backup]
csv_path = "backups"
partition = "day"

[backup.retention]
policy = "keep_newest"
high_watermark_percent = 90
low_watermark_percent = 80
minimum_free_bytes = 104857600
prune_every = 2

[backup.retention.images]
feed_priority = 80
full_resolution_priority = 40

[fan]
enabled = true
i2c_address = 0x4C

[[sensors]]
name = "bme680"
sensor = "bme680"
poll_hz = 0.5
priority = 10

[[sensors.checks]]
measurement = "temperature"
min = -20
max = 60

[[sensors.checks]]
measurement = "humidity"
min = 0
max = 100

[[sensors]]
name = "emc2101"
sensor = "emc2101"
i2c_address = 0x4C
poll_hz = 0.5
priority = 20

[[sensors]]
name = "ina219"
sensor = "ina219"
i2c_address = 0x40
poll_hz = 0.1
priority = 5
