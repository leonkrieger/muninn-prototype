[suit]
suitID = "delta-01"

[publisher]
pub_backend = "zeromq"
endpoint = "tcp://*:5555"

[logging]
level = "DEBUG"

[heartbeat]
hb_freq_s = 10

[optics]
enabled = true
feed_fps = 0.2
width = 640
height = 480
jpeg_quality = 70

[fan]
enabled = true
i2c_address = 0x4C

[[sensors]]
name = "bme680"
sensor = "bme680"
poll_hz = 0.5

[[sensors]]
name = "emc2101"
sensor = "emc2101"
i2c_address = 0x4C
poll_hz = 0.5
